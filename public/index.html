<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Traffic Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen">

    <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl text-center w-80 relative overflow-hidden">
        <div class="absolute top-0 right-0 p-4 opacity-10">
            <i class="fas fa-users text-8xl text-blue-500"></i>
        </div>

        <h2 class="text-slate-400 text-sm font-bold uppercase tracking-widest mb-2">Live Visitors</h2>
        
        <div class="relative inline-block">
            <h1 id="count" class="text-8xl font-black text-white transition-all duration-300">0</h1>
            <div class="absolute -top-2 -right-4 h-4 w-4 rounded-full bg-green-500 pulse"></div>
        </div>

        <div class="mt-6 pt-6 border-t border-slate-700">
            <p class="text-xs text-slate-500">Waiting for data...</p>
        </div>
    </div>

    <div class="mt-8 w-full max-w-lg bg-slate-900 p-4 rounded-lg border border-slate-800">
        <p class="text-sm text-slate-400 mb-2">👇 Ye code apni doosri websites me daal:</p>
        <div class="bg-black p-3 rounded text-xs text-green-400 font-mono overflow-x-auto select-all cursor-pointer" id="codeBlock">
            Checking URL...
        </div>
    </div>

    <script>
        const socket = io(); // Admin connection

        // Live Count Update
        socket.on('update_count', (val) => {
            document.getElementById('count').innerText = val;
        });

        // Auto-Generate Integration Code
        const currentUrl = window.location.origin;
        const scriptCode = `
<script src="${currentUrl}/socket.io/socket.io.js"><\/script>
<script>
  const socket = io("${currentUrl}", { query: { type: 'visitor' } });
<\/script>`;
        
        document.getElementById('codeBlock').innerText = scriptCode;
    </script>
</body>
</html>
