<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>body { background: #0f172a; color: white; }</style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-500">⚡ Live Dashboard</h1>
            <div class="text-right">
                <p class="text-gray-400 text-xs">Status</p>
                <p class="text-green-400 font-bold">● System Online</p>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-blue-500/30">
                <p class="text-gray-400 text-xs uppercase">Live Users</p>
                <h2 id="liveCount" class="text-5xl font-bold mt-2">0</h2>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-purple-500/30">
                <p class="text-gray-400 text-xs uppercase">Total History</p>
                <h2 id="historyCount" class="text-5xl font-bold mt-2">Loading...</h2>
            </div>
        </div>

        <div class="flex gap-2 mb-8">
            <input id="alertMsg" type="text" placeholder="Send popup message to all users..." class="bg-slate-800 border border-slate-600 p-3 rounded w-full text-white focus:outline-none focus:border-blue-500">
            <button onclick="sendAlert()" class="bg-blue-600 px-6 rounded font-bold hover:bg-blue-500">SEND</button>
        </div>

        <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700">
            <table class="w-full text-left text-sm text-gray-400">
                <thead class="bg-slate-900 text-gray-200 uppercase text-xs">
                    <tr>
                        <th class="p-4">Website</th>
                        <th class="p-4">Page</th>
                        <th class="p-4">Device</th>
                    </tr>
                </thead>
                <tbody id="userTable">
                    <tr><td colspan="3" class="p-4 text-center">Waiting for data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Seedha connect (No Login)
        const socket = io({ query: { type: 'admin' } });

        socket.on('update_dashboard', (data) => {
            document.getElementById('liveCount').innerText = data.totalLive;
            document.getElementById('historyCount').innerText = data.totalHistory || 0;

            const tbody = document.getElementById('userTable');
            tbody.innerHTML = '';

            Object.values(data.liveUsers).forEach(u => {
                tbody.innerHTML += `
                    <tr class="border-b border-gray-700">
                        <td class="p-4 text-white font-bold">${u.website}</td>
                        <td class="p-4 text-yellow-500">${u.page}</td>
                        <td class="p-4">${u.device}</td>
                    </tr>
                `;
            });
        });

        function sendAlert() {
            const msg = document.getElementById('alertMsg').value;
            if(msg) {
                socket.emit('send_alert', msg);
                alert("Sent!");
                document.getElementById('alertMsg').value = '';
            }
        }
    </script>
</body>
</html>
